<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>金额大写 / 汇总</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230A0A0A'/%3E%3Ccircle cx='50' cy='50' r='29.8' stroke='%23fff' stroke-width='4.9' fill='none'/%3E%3Cpath d='M42 38l8 10 8-10M50 48v17M43 54h14M43 60h14' stroke='%23fff' stroke-width='4.2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<meta name="theme-color" content="#FFFFFF">
<style>
  :root{--ink:#0A0A0A;--ink2:#111;--soft:#6B6B6B;--faint:#A3A3A3;--paper:#FFF;--shell:#F7F7F7;--line:#E6E6E6;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--paper);color:var(--ink);}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;}
  button,textarea{font:inherit;color:inherit;}
  .back{position:fixed;top:16px;left:18px;font-size:13px;color:var(--faint);text-decoration:none;padding:6px 8px;z-index:5;transition:color .15s;}
  .back:hover{color:var(--ink);}
  .wrap{max-width:720px;margin:0 auto;padding:64px 24px 56px;display:flex;flex-direction:column;gap:22px;}
  header{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;margin-bottom:6px;}
  .ring{width:50px;height:50px;color:var(--ink);}
  h1{font-size:32px;font-weight:700;letter-spacing:3px;}
  .desc{font-size:15px;color:var(--soft);max-width:400px;line-height:1.7;}
  .card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--paper);}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--shell);min-height:50px;}
  .card-h span{font-size:14px;font-weight:600;letter-spacing:.5px;}
  textarea{display:block;width:100%;min-height:96px;border:0;outline:0;resize:vertical;padding:16px;font-size:22px;line-height:1.5;font-variant-numeric:tabular-nums;background:var(--paper);}
  textarea::placeholder{color:var(--faint);font-size:16px;}
  .seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--paper);}
  .seg button{border:0;background:transparent;border-radius:999px;font-size:12.5px;padding:4px 14px;cursor:pointer;color:var(--soft);transition:all .15s;}
  .seg button.on{background:var(--ink2);color:#fff;}
  .opt{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--soft);cursor:pointer;user-select:none;}
  .opt input{accent-color:#111;width:14px;height:14px;}
  .btn{font-size:13px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 16px;cursor:pointer;transition:all .15s;white-space:nowrap;}
  .btn:hover{border-color:var(--ink);}
  .btn:active{transform:scale(.96);}
  .btn.dark{background:var(--ink2);color:#fff;border-color:var(--ink2);}
  .btn.ok{background:#fff;color:var(--ink);border-color:var(--ink);}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between;}
  .rows{display:flex;flex-direction:column;}
  .row{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:0;}
  .row .t{flex:1;min-width:0;}
  .row .n{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;}
  .row .u{font-size:22px;font-weight:600;letter-spacing:1px;word-break:break-all;line-height:1.5;margin-top:2px;}
  .row .u.err{font-size:14px;font-weight:400;color:var(--soft);letter-spacing:0;}
  .row .btns{display:flex;flex-direction:column;gap:6px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));border-bottom:1px solid var(--line);}
  .stats div{padding:12px 16px;border-right:1px solid var(--line);}
  .stats div:last-child{border-right:0;}
  .stats small{display:block;font-size:12px;color:var(--faint);}
  .stats b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;word-break:break-all;}
  .empty{padding:36px 16px;text-align:center;color:var(--faint);font-size:14px;}
  .tip{font-size:12px;color:var(--faint);text-align:center;}
  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink2);color:#fff;font-size:13px;padding:10px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:all .25s;z-index:20;}
  .toast.show{opacity:1;transform:translate(-50%,0);}
  @media (max-width:520px){.row{flex-direction:column;align-items:stretch}.row .btns{flex-direction:row}.row .btns .btn{flex:1}}
</style>
</head>
<body>
<a class="back" href="index.html">‹ 工具集</a>
<div class="wrap">
  <header>
    <svg class="ring" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="50" cy="50" r="29.8" stroke="currentColor" stroke-width="4.9"/>
      <path d="M42 38l8 10 8-10M50 48v17M43 54h14M43 60h14" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>金额大写 / 汇总</h1>
    <p class="desc">输入金额,实时转人民币大写并汇总合计,一键复制。每行一个金额,可批量处理。</p>
  </header>

  <div class="card">
    <div class="card-h"><span>金额</span><button class="btn" id="clear" type="button">清空</button></div>
    <textarea id="inp" placeholder="例如 1234567.89,支持 ¥、逗号分隔,每行一个" spellcheck="false" inputmode="decimal" autofocus></textarea>
  </div>

  <div class="bar">
    <div class="seg" id="style"><button type="button" data-v="fin" class="on">财务大写 壹贰叁</button><button type="button" data-v="cn">中文数字 一二三</button></div>
    <label class="opt"><input type="checkbox" id="zheng" checked>有角无分时加「整」</label>
  </div>

  <div class="card">
    <div class="card-h"><span>大写结果</span><button class="btn dark" id="copyAll" type="button" hidden>复制全部</button></div>
    <div class="rows" id="rows"><div class="empty">在上方输入金额</div></div>
  </div>
  <div class="card" id="sumCard" hidden>
    <div class="card-h"><span>汇总</span><button class="btn dark" id="copySum" type="button">复制汇总</button></div>
    <div class="stats" id="stats"></div>
    <div class="row sumup"><div class="t"><div class="n">合计大写</div><div class="u" id="sumUpper"></div></div><div class="btns"><button class="btn dark" id="cpSumU" type="button">复制大写</button><button class="btn" id="cpSumN" type="button">复制合计</button></div></div>
  </div>
  <p class="tip">超过两位小数按四舍五入处理 · 支持到万亿元 · 文本仅在本机处理</p>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const FIN = { d: '零壹贰叁肆伍陆柒捌玖', u: ['', '拾', '佰', '仟'] };
const CN  = { d: '零一二三四五六七八九', u: ['', '十', '百', '千'] };
const BIG = ['', '万', '亿', '万亿'];
let styleSel = 'fin';

function group4(s, T){                      // s: 4 位数字字符串 -> 文字
  let out = '', zero = false;
  for (let i = 0; i < 4; i++) {
    const d = +s[i], u = T.u[3 - i];
    if (d) { if (zero && out) out += T.d[0]; out += T.d[d] + u; zero = false; }
    else if (out) zero = true;
  }
  return out;
}
function intToUpper(str, T){                // str: 十进制整数字符串
  str = str.replace(/^0+/, '') || '0';
  if (str === '0') return T.d[0];
  if (str.length > 16) throw new Error('金额过大(最多支持 16 位整数)');
  const padded = str.padStart(Math.ceil(str.length / 4) * 4, '0');
  const groups = padded.match(/\d{4}/g);    // 高 -> 低
  let out = '';
  groups.forEach((g, i) => {
    const level = groups.length - 1 - i;
    if (g === '0000') return;
    let t = group4(g, T);
    if (out && +g < 1000) t = T.d[0] + t;   // 低位组出现前导零,补「零」
    out += t + BIG[level];
  });
  return out;
}
function parse(raw){
  let s = raw.trim().replace(/[¥￥,，\s]/g, '').replace(/元$/, '').replace(/^人民币/, '');
  if (!s) return null;
  let neg = false;
  if (/^[-−负]/.test(s)) { neg = true; s = s.slice(1); }
  if (!/^(\d+\.?\d*|\.\d+)$/.test(s)) throw new Error('不是有效的金额');
  let [ip = '0', fp = ''] = s.split('.');
  ip = ip || '0';
  let cents = BigInt(ip) * 100n + BigInt((fp + '00').slice(0, 2));
  if (fp.length > 2 && fp[2] >= '5') cents += 1n;   // 四舍五入
  return { neg, cents };
}
function toUpper(raw, T, zheng){
  const p = parse(raw); if (!p) return null;
  const intPart = (p.cents / 100n).toString(), r = Number(p.cents % 100n), j = Math.floor(r / 10), f = r % 10;
  let text = '';
  if (p.cents === 0n) text = T.d[0] + '元整';
  else {
    const intZero = intPart === '0';
    if (!intZero) text += intToUpper(intPart, T) + '元';
    if (j === 0 && f === 0) text += '整';
    else {
      if (j) text += T.d[j] + '角';
      if (f) { if (!j && !intZero) text += T.d[0]; text += T.d[f] + '分'; }
      else if (zheng) text += '整';
    }
  }
  if (T === CN) text = text.replace(/^一十/, '十');
  const money = (p.neg && p.cents ? '-' : '') + '¥' + Number(intPart).toLocaleString('en-US').replace(/^NaN$/, intPart) + '.' + String(r).padStart(2, '0');
  const bigMoney = (p.neg && p.cents ? '-' : '') + '¥' + intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + String(r).padStart(2, '0');
  return { text: (p.neg && p.cents ? '负' : '') + text, money: bigMoney, cents: p.neg ? -p.cents : p.cents };
}

/* ---------- 界面 ---------- */
let results = [];
function render(){
  const lines = $('inp').value.split('\n');
  const T = styleSel === 'fin' ? FIN : CN, zheng = $('zheng').checked;
  results = [];
  const box = $('rows'); box.innerHTML = '';
  lines.forEach((ln, i) => {
    if (!ln.trim()) return;
    let r;
    try { r = toUpper(ln, T, zheng); } catch(e) { r = { err: e.message }; }
    if (!r) return;
    results.push(r);
    const row = document.createElement('div'); row.className = 'row';
    const t = document.createElement('div'); t.className = 't';
    const n = document.createElement('div'); n.className = 'n'; n.textContent = r.err ? ln.trim() : r.money;
    const u = document.createElement('div'); u.className = 'u' + (r.err ? ' err' : ''); u.textContent = r.err || r.text;
    t.append(n, u); row.appendChild(t);
    if (!r.err) {
      const b = document.createElement('div'); b.className = 'btns';
      const c1 = document.createElement('button'); c1.className = 'btn dark'; c1.type = 'button'; c1.textContent = '复制大写';
      c1.onclick = () => copy(r.text, c1);
      const c2 = document.createElement('button'); c2.className = 'btn'; c2.type = 'button'; c2.textContent = '复制 ' + r.money.length + ' 位小写'.replace(/.*/, '小写');
      c2.textContent = '复制小写'; c2.onclick = () => copy(r.money, c2);
      b.append(c1, c2); row.appendChild(b);
    }
    box.appendChild(row);
  });
  if (!results.length) box.innerHTML = '<div class="empty">在上方输入金额</div>';
  const okCount = results.filter(r => !r.err).length;
  $('copyAll').hidden = okCount < 2;
  renderSum(T, zheng);
}
const fmtC = c => { const neg = c < 0n, a = neg ? -c : c, i = (a / 100n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); return (neg ? '-' : '') + '¥' + i + '.' + String(a % 100n).padStart(2, '0'); };
let sumInfo = null;
function renderSum(T, zheng){
  const ok = results.filter(r => !r.err && r.cents !== undefined), box = $('sumCard');
  box.hidden = ok.length < 1; if (!ok.length) { sumInfo = null; return; }
  const cs = ok.map(r => r.cents), total = cs.reduce((a, b) => a + b, 0n);
  const max = cs.reduce((a, b) => b > a ? b : a), min = cs.reduce((a, b) => b < a ? b : a);
  const n = BigInt(cs.length), avg = total >= 0n ? (total * 2n + n) / (2n * n) : -((-total * 2n + n) / (2n * n));
  const sign = total < 0n ? '-' : '', ab = total < 0n ? -total : total;
  const raw = sign + (ab / 100n) + '.' + String(ab % 100n).padStart(2, '0');
  const up = toUpper(raw, T, zheng);
  sumInfo = { count: ok.length, total: fmtC(total), upper: up.text, max: fmtC(max), min: fmtC(min), avg: fmtC(avg) };
  $('stats').innerHTML = '';
  [['张数', ok.length], ['合计', sumInfo.total], ['最大', sumInfo.max], ['最小', sumInfo.min], ['平均', sumInfo.avg]].forEach(([k, v]) => { const d = document.createElement('div'); d.innerHTML = '<small></small><b></b>'; d.firstChild.textContent = k; d.lastChild.textContent = v; $('stats').appendChild(d); });
  $('sumUpper').textContent = sumInfo.upper;
}
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1600); }
async function copy(text, btn){
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch(e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;left:-999px';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch(_) {}
    ta.remove();
  }
  toast(ok ? '已复制:' + (text.length > 22 ? text.slice(0, 22) + '…' : text) : '复制失败,请手动选择复制');
  if (ok && btn) { const old = btn.textContent; btn.textContent = '已复制 ✓'; btn.classList.add('ok'); setTimeout(() => { btn.textContent = old; btn.classList.remove('ok'); }, 1200); }
}
$('inp').addEventListener('input', render);
$('zheng').addEventListener('change', render);
$('style').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; styleSel = b.dataset.v; document.querySelectorAll('#style button').forEach(x => x.classList.toggle('on', x === b)); render(); });
$('clear').onclick = () => { $('inp').value = ''; render(); $('inp').focus(); };
$('copyAll').onclick = () => copy(results.filter(r => !r.err).map(r => r.text).join('\n'), $('copyAll'));
$('cpSumU').onclick = () => sumInfo && copy(sumInfo.upper, $('cpSumU'));
$('cpSumN').onclick = () => sumInfo && copy(sumInfo.total.replace(/[¥,]/g, ''), $('cpSumN'));
$('copySum').onclick = () => sumInfo && copy(`张数:${sumInfo.count}\n合计:${sumInfo.total}\n大写:${sumInfo.upper}\n最大:${sumInfo.max}\n最小:${sumInfo.min}\n平均:${sumInfo.avg}`, $('copySum'));
window.__rmb = { toUpper, FIN, CN };
render();
})();
</script>
</body>
</html>

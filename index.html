<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>工具集</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230A0A0A'/%3E%3Ccircle cx='50' cy='50' r='29.8' stroke='%23fff' stroke-width='4.9' fill='none'/%3E%3Cg fill='%23fff'%3E%3Ccircle cx='43' cy='43' r='4.6'/%3E%3Ccircle cx='57' cy='43' r='4.6'/%3E%3Ccircle cx='43' cy='57' r='4.6'/%3E%3Ccircle cx='57' cy='57' r='4.6'/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#FFFFFF">
<style>
  :root{--ink:#0A0A0A;--ink2:#111;--soft:#6B6B6B;--faint:#A3A3A3;--paper:#FFF;--shell:#F7F7F7;--line:#E6E6E6;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .hub{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;padding:48px 24px;}
  .mark{display:flex;flex-direction:column;align-items:center;gap:16px;}
  .ring{width:50px;height:50px;color:var(--ink);}
  h1{font-size:32px;font-weight:700;letter-spacing:3px;}
  .desc{font-size:15px;color:var(--soft);max-width:360px;line-height:1.7;}
  .list{width:100%;max-width:960px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:4px;}
  .tool{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:20px 18px;border:1px solid var(--line);border-radius:16px;text-decoration:none;color:inherit;text-align:left;background:var(--paper);transition:all .18s;}
  .tool:hover{border-color:var(--ink);transform:translateY(-1px);box-shadow:0 10px 26px rgba(0,0,0,.08);}
  .tool{-webkit-tap-highlight-color:transparent;position:relative;}
  .tool:active{transform:scale(.95);background:var(--shell);border-color:var(--ink);transition-duration:.08s;}
  .tool.go{background:var(--ink);color:#fff;border-color:var(--ink);transform:scale(.97);}
  .tool.go svg{color:#fff;}
  .tool.go::after{content:"";position:absolute;right:14px;top:14px;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
  body.leaving .tool:not(.go){opacity:.35;transition:opacity .2s;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pgin{from{opacity:0}to{opacity:1}}
  .tool svg{width:40px;height:40px;flex:none;color:var(--ink);}
  .tool b{display:block;font-size:16px;font-weight:600;letter-spacing:1px;}
  .tool span{display:block;font-size:13px;color:var(--soft);margin-top:3px;line-height:1.55;}
    .note{font-size:12.5px;color:var(--faint);}
  .mark,.desc,.list,.note{opacity:0;animation:up .5s ease-out forwards;}
  .mark{animation-delay:.02s}.desc{animation-delay:.1s}.list{animation-delay:.18s}.note{animation-delay:.26s}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.tool,.tool.go::after{transition:none;animation:none}.mark,.desc,.list,.note{animation:none;opacity:1}}
</style>
<link rel="apple-touch-icon" href="icons/hub.png">
<link rel="icon" type="image/png" sizes="180x180" href="icons/hub.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="工具集">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<style>@supports(padding:max(0px)){.back{top:max(16px,env(safe-area-inset-top));left:max(18px,env(safe-area-inset-left))}}</style>
</head>
<body>
<main class="hub">
  <div class="mark">
    <svg class="ring" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="50" cy="50" r="29.8" stroke="currentColor" stroke-width="4.9"/>
      <g fill="currentColor"><circle cx="43" cy="43" r="4.6"/><circle cx="57" cy="43" r="4.6"/><circle cx="43" cy="57" r="4.6"/><circle cx="57" cy="57" r="4.6"/></g>
    </svg>
    <h1>工具集</h1>
  </div>
  <p class="desc">几个小而专注的文件工具,打开即用,文件只在本机浏览器处理。</p>

  <nav class="list">
    <a class="tool" href="gaigai.html">
      <svg viewBox="0 0 100 100" fill="none" aria-hidden="true"><circle cx="50" cy="50" r="29.8" stroke="currentColor" stroke-width="4.9"/><circle cx="50" cy="50" r="8.4" fill="currentColor"/></svg>
      <div><b>盖盖</b><span>给 PDF 或图片盖章、签名</span></div>
    </a>
    <a class="tool" href="pdf-tools.html">
      <svg viewBox="0 0 100 100" fill="none" aria-hidden="true"><circle cx="50" cy="50" r="29.8" stroke="currentColor" stroke-width="4.9"/><rect x="41" y="37" width="18" height="26" rx="3" stroke="currentColor" stroke-width="4.2"/></svg>
      <div><b>PDF 工具箱</b><span>合并、拆分、转换、压缩、页码等 10 个功能</span></div>
    </a>
    <a class="tool" href="md-converter.html">
      <svg viewBox="0 0 100 100" fill="none" aria-hidden="true"><circle cx="50" cy="50" r="29.8" stroke="currentColor" stroke-width="4.9"/><path d="M50 38V60M41.5 51.5L50 60L58.5 51.5" stroke="currentColor" stroke-width="4.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>MD 转换</b><span>Markdown 转排版好的 Word 文档</span></div>
    </a>
    <a class="tool" href="invoice-merge.html">
      <svg viewBox="0 0 100 100" fill="none" aria-hidden="true"><circle cx="50" cy="50" r="29.8" stroke="currentColor" stroke-width="4.9"/><path d="M41 36h18v28l-3-2.5-3 2.5-3-2.5-3 2.5-3-2.5-3 2.5zM46 44h8M46 50h8" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>发票合并</b><span>发票自动裁边,拼成 A4 打印</span></div>
    </a>
    <a class="tool" href="rmb-upper.html">
      <svg viewBox="0 0 100 100" fill="none" aria-hidden="true"><circle cx="50" cy="50" r="29.8" stroke="currentColor" stroke-width="4.9"/><path d="M42 38l8 10 8-10M50 48v17M43 54h14M43 60h14" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>金额大写 / 汇总</b><span>转人民币大写,批量合计,一键复制</span></div>
    </a>
    <a class="tool" href="tax-calc.html">
      <svg viewBox="0 0 100 100" fill="none" aria-hidden="true"><circle cx="50" cy="50" r="29.8" stroke="currentColor" stroke-width="4.9"/><path d="M41 59l18-18" stroke="currentColor" stroke-width="4.2" stroke-linecap="round"/><circle cx="42" cy="42" r="2.6" fill="currentColor" stroke="currentColor"/><circle cx="58" cy="58" r="2.6" fill="currentColor" stroke="currentColor"/></svg>
      <div><b>含税换算</b><span>含税 / 不含税互算,得出税额</span></div>
    </a>
  </nav>
</main>
<script>
(function(){
  var ts=[].slice.call(document.querySelectorAll('a.tool'));
  ts.forEach(function(a){
    var l=document.createElement('link');l.rel='prefetch';l.href=a.getAttribute('href');document.head.appendChild(l);
    a.addEventListener('click',function(e){
      if(e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;
      e.preventDefault();a.classList.add('go');document.body.classList.add('leaving');
      setTimeout(function(){location.href=a.href;},140);
    });
  });
  window.addEventListener('pageshow',function(){document.body.classList.remove('leaving');ts.forEach(function(a){a.classList.remove('go')});});
})();
</script>
</body>
</html>

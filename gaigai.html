<!-- iOS "Add to Home Screen" behaviour -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFFFFF">

<style>
  :root{
    --paper:#FFFFFF;
    --shell:#F7F7F7;
    --shell-line:#E6E6E6;
    --ink:#0A0A0A;
    --ink-soft:#6B6B6B;
    --ink-faint:#A3A3A3;
    --accent:#111111;
    --accent-dark:#000000;
    --accent-wash:#EFEFEF;
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
    --safe-left:env(safe-area-inset-left, 0px);
    --safe-right:env(safe-area-inset-right, 0px);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);height:100%;overscroll-behavior:none;}
  body{
    -webkit-tap-highlight-color:transparent;
    -webkit-text-size-adjust:100%;
  }
  [hidden]{display:none !important;}

  /* app-like touch behaviour: no callout/selection on buttons, snappy taps, no rubber-band on inner scrollers */
  button{
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    touch-action:manipulation;
  }
  a, .seal-card-thumb, .btn, .landing-upload, .btn-icon, .stepper button{
    touch-action:manipulation;
  }
  .landing-title, .landing-desc, .brand-mark, .seal-card-name, .stepper-value, .modal-title{
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  .stage-scroll, .modal-body{
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }

  /* ============ landing view ============ */
  .landing{
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;text-align:center;background:var(--paper);
    transition:background .15s;
    padding:calc(48px + var(--safe-top)) calc(24px + var(--safe-right)) calc(48px + var(--safe-bottom)) calc(24px + var(--safe-left));
  }
  .landing.drag-over{background:var(--accent-wash);}
  .landing-mark{display:flex;flex-direction:column;align-items:center;gap:16px;}
  .seal-ring{width:50px;height:50px;color:var(--ink);}
  .landing-title{font-size:38px;font-weight:700;letter-spacing:3px;margin:0;color:var(--ink);}
  .landing-desc{font-size:15px;color:var(--ink-soft);margin:0;max-width:360px;line-height:1.7;}
  .landing-upload{
    appearance:none;border:none;background:var(--accent);color:#fff;
    font-size:15px;font-weight:600;padding:15px 44px;border-radius:999px;cursor:pointer;
    letter-spacing:1px;transition:transform .15s,background .15s,box-shadow .15s;
    box-shadow:0 10px 26px rgba(0,0,0,.16);
  }
  .landing-upload:hover{background:var(--accent-dark);transform:translateY(-1px);box-shadow:0 12px 30px rgba(0,0,0,.2);}
  .landing-upload:active{transform:translateY(0) scale(.97);}
  .landing-manage-link{
    appearance:none;border:none;background:none;color:var(--ink-faint);font-size:12.5px;
    cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:4px;margin-top:2px;
  }
  .landing-manage-link:hover{color:var(--ink);}

  .landing-info-btn{
    position:fixed;right:calc(18px + var(--safe-right));bottom:calc(18px + var(--safe-bottom));
    width:30px;height:30px;border-radius:50%;border:1px solid var(--shell-line);background:var(--paper);
    color:var(--ink-faint);font-size:14px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s;
    z-index:30;
  }
  .landing-info-btn:hover{border-color:var(--ink);color:var(--ink);}
  .info-text{font-size:12.5px;color:var(--ink-soft);line-height:1.7;margin:0;}
  .info-text + .info-text{margin-top:12px;}

  @keyframes landingFadeUp{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  .landing-mark, .landing-desc, .landing-upload, .landing-manage-link{
    animation:landingFadeUp .5s ease both;
  }
  .landing-mark{animation-delay:.02s;}
  .landing-desc{animation-delay:.10s;}
  .landing-upload{animation-delay:.18s;}
  .landing-manage-link{animation-delay:.26s;}
  @media (prefers-reduced-motion: reduce){
    .landing-mark, .landing-desc, .landing-upload, .landing-manage-link{animation:none;}
  }

  /* ============ workspace view ============ */
  .workspace{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;}

  .topbar{
    position:sticky;top:0;z-index:40;background:var(--paper);
    border-bottom:1px solid var(--shell-line);
    padding-top:var(--safe-top);
  }
  .topbar-inner{
    max-width:1080px;margin:0 auto;padding:13px 20px;
    padding-left:calc(20px + var(--safe-left));padding-right:calc(20px + var(--safe-right));
    display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;
  }
  .brand-mark{font-size:16px;font-weight:700;letter-spacing:2px;color:var(--ink);margin-right:auto;}

  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
  .field-label{font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  .field-group{display:flex;align-items:center;gap:6px;}

  input[type="text"].fn-input{
    width:180px;max-width:40vw;font-size:13px;padding:7px 10px;
    border:1px solid var(--shell-line);border-radius:7px;background:var(--paper);color:var(--ink);
  }
  input[type="text"].fn-input:focus{outline:2px solid var(--accent-wash);border-color:var(--accent);}

  .btn{
    appearance:none;border:1px solid var(--shell-line);background:var(--paper);color:var(--ink);
    font-size:13px;padding:7px 14px;border-radius:7px;cursor:pointer;white-space:nowrap;
    transition:border-color .15s,background .15s,transform .1s;
  }
  .btn:hover{border-color:var(--ink);}
  .btn:active{transform:scale(.96);}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .btn-primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);}
  .btn-primary:disabled{background:var(--ink-faint);border-color:var(--ink-faint);cursor:not-allowed;}
  .btn-primary:disabled:active{transform:none;}
  .btn-ghost{background:transparent;}
  .btn[hidden]{display:none;}

  .btn-icon{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--shell-line);background:var(--paper);
    color:var(--ink-soft);font-size:14px;line-height:1;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none;
    transition:border-color .15s,color .15s,transform .1s;
  }
  .btn-icon:hover{border-color:var(--ink);color:var(--ink);}
  .btn-icon:active{transform:scale(.92);background:var(--shell);}

  .stepper{
    display:flex;align-items:center;border:1px solid var(--shell-line);border-radius:8px;overflow:hidden;flex:none;
  }
  .stepper button{
    appearance:none;border:none;background:var(--paper);color:var(--ink);
    width:32px;height:34px;font-size:16px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .1s;
  }
  .stepper button:hover{background:var(--shell);}
  .stepper button:active{background:var(--accent-wash);}
  .stepper-value{
    font-size:12px;color:var(--ink-soft);padding:0 8px;min-width:46px;text-align:center;
    border-left:1px solid var(--shell-line);border-right:1px solid var(--shell-line);
  }

  .checkerboard{
    background-image:
      linear-gradient(45deg, #eaeaea 25%, transparent 25%),
      linear-gradient(-45deg, #eaeaea 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #eaeaea 75%),
      linear-gradient(-45deg, transparent 75%, #eaeaea 75%);
    background-size:12px 12px;
    background-position:0 0, 0 6px, 6px -6px, -6px 0px;
    background-color:#fff;
  }

  .seal-picker-btn{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--shell-line);
    padding:3px;cursor:pointer;flex:none;overflow:hidden;transition:border-color .15s,transform .1s;
  }
  .seal-picker-btn:hover{border-color:var(--ink);}
  .seal-picker-btn:active{transform:scale(.92);}
  .seal-picker-btn img{width:100%;height:100%;object-fit:contain;border-radius:50%;display:block;}

  /* ---------- seal library modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(10,10,10,.4);display:none;
    align-items:center;justify-content:center;z-index:120;padding:20px;
    opacity:0;transition:opacity .2s;
  }
  .modal-overlay.show{display:flex;opacity:1;}
  .modal-panel{
    background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:82vh;max-height:82dvh;
    display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;
    transform:scale(.97);opacity:0;transition:transform .2s,opacity .2s;
  }
  .modal-overlay.show .modal-panel{transform:scale(1);opacity:1;}
  .info-panel{max-width:380px;}
  .modal-grabber{display:none;}
  .modal-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px;border-bottom:1px solid var(--shell-line);flex:none;
  }
  .modal-title{font-size:15px;font-weight:700;letter-spacing:.5px;margin:0;color:var(--ink);}
  .modal-tabs{display:flex;gap:4px;background:var(--shell);border-radius:9px;padding:3px;}
  .modal-tab{
    appearance:none;border:none;background:none;color:var(--ink-soft);
    font-size:13px;font-weight:600;padding:7px 16px;border-radius:7px;cursor:pointer;
    transition:background .15s,color .15s;
  }
  .modal-tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1);}
  .modal-body{padding:16px 18px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px;}

  .modal-search{
    font-size:13px;padding:9px 12px;border:1px solid var(--shell-line);border-radius:8px;
    background:var(--shell);color:var(--ink);width:100%;flex:none;
  }
  .modal-search:focus{outline:2px solid var(--accent-wash);border-color:var(--accent);}

  .seal-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
  }
  .seal-card{
    display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;
  }
  .seal-card-thumb{
    appearance:none;border:1.5px solid var(--shell-line);border-radius:10px;width:100%;aspect-ratio:1/1;
    padding:0;cursor:pointer;overflow:hidden;transition:border-color .15s;
  }
  .seal-card.active .seal-card-thumb{border-color:var(--ink);border-width:2px;}
  .seal-card-thumb:hover{border-color:var(--ink);}
  .seal-card-thumb img{width:100%;height:100%;object-fit:contain;display:block;}
  .seal-card-name{
    font-size:11.5px;color:var(--ink-soft);text-align:center;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .seal-card-delete{
    position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;
    border:1px solid var(--shell-line);background:#fff;color:var(--ink-soft);
    font-size:11px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 3px rgba(0,0,0,.15);
  }
  .seal-card-delete:hover{background:var(--ink);color:#fff;border-color:var(--ink);}

  .seal-card-add{
    background:none;border:none;padding:0;cursor:pointer;
  }
  .seal-card-add .seal-card-thumb{
    display:flex;align-items:center;justify-content:center;border-style:dashed;background:var(--shell);
  }
  .seal-card-add-icon{font-size:22px;color:var(--ink-faint);line-height:1;}
  .seal-card-add:hover .seal-card-thumb{border-color:var(--ink);}
  .seal-card-add:hover .seal-card-add-icon{color:var(--ink);}

  .seal-grid-empty{
    grid-column:1/-1;text-align:center;font-size:12.5px;color:var(--ink-faint);padding:24px 0;
  }

  .seal-preview-box{
    width:100%;aspect-ratio:1/1;max-height:260px;border-radius:12px;border:1px solid var(--shell-line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;
  }
  .seal-preview-box img{max-width:80%;max-height:80%;object-fit:contain;}
  .seal-name-input{width:100%;max-width:none;}
  .seal-preview-actions{display:flex;justify-content:flex-end;gap:10px;flex:none;}

  .sig-pad-wrap{
    width:100%;border:1px solid var(--shell-line);border-radius:12px;overflow:hidden;
    background:#fff;flex:none;
  }
  #signatureCanvas{width:100%;height:auto;aspect-ratio:1100/550;display:block;touch-action:none;cursor:crosshair;}
  .sig-rotate-hint{
    margin:0;font-size:12px;color:var(--ink-faint);text-align:center;flex:none;
  }
  .sig-pad-actions{display:flex;justify-content:center;flex:none;}

  /* ---------- main stage area ---------- */
  .main{
    flex:1;display:flex;flex-direction:column;align-items:center;background:var(--shell);
    padding:22px calc(16px + var(--safe-right)) calc(60px + var(--safe-bottom)) calc(16px + var(--safe-left));
  }

  .page-nav{
    display:flex;flex-direction:column;gap:8px;margin-bottom:14px;
    font-size:13px;color:var(--ink-soft);width:100%;max-width:640px;
  }
  .page-nav-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .page-nav .btn{padding:5px 11px;font-size:12px;}
  .seal-page-pill{
    display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);
    background:var(--paper);border:1px solid var(--shell-line);padding:5px 10px;border-radius:20px;
  }
  .seal-page-pill button{border:none;background:none;color:var(--ink);font-size:12px;cursor:pointer;padding:0;font-weight:600;}

  .stamp-modes-row{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:8px 10px;background:var(--paper);border:1px solid var(--shell-line);border-radius:8px;
  }
  .mode-toggle{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);
    cursor:pointer;white-space:nowrap;user-select:none;
  }
  .mode-toggle input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer;}
  .sig-toggle{
    border:1px solid var(--shell-line);border-radius:7px;padding:6px 10px;flex:none;
  }
  .sig-toggle:hover{border-color:var(--ink);}
  .range-input{
    font-size:12.5px;padding:5px 9px;border:1px solid var(--shell-line);border-radius:6px;
    background:var(--paper);color:var(--ink);width:170px;max-width:44vw;
  }
  .range-input:focus{outline:2px solid var(--accent-wash);border-color:var(--accent);}
  .mode-hint{font-size:11.5px;color:var(--ink-faint);}

  .stage-viewport{
    width:100%;max-width:640px;position:relative;
    background:var(--shell);
  }
  .stage-scroll{
    max-height:74vh;max-height:74dvh;overflow-y:auto;overflow-x:hidden;
    border-radius:4px;
  }
  .stage-box{
    position:relative;width:100%;margin:0 auto;
    background:#fff;box-shadow:0 1px 3px rgba(10,10,10,.08),0 10px 30px -12px rgba(10,10,10,.18);
  }
  .stage-scaler{
    position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;overflow:hidden;
  }
  .pdf-canvas{display:block;width:100%;height:100%;}

  .img-content{
    position:relative;width:100%;height:100%;background:#fff;overflow:hidden;
  }
  .img-content img{
    position:absolute;display:block;box-shadow:0 0 0 1px rgba(10,10,10,.06);
  }

  /* ---------- seal ---------- */
  .seal-layer{
    position:absolute;aspect-ratio:1/1;cursor:grab;touch-action:none;display:none;
    filter:drop-shadow(0 2px 5px rgba(0,0,0,.18));
  }
  .seal-layer.dragging{cursor:grabbing;}
  .seal-layer.active{display:block;}
  .seal-img{width:100%;height:100%;display:block;pointer-events:none;user-select:none;}
  .seal-outline{
    position:absolute;inset:-3px;border:1.5px dashed rgba(10,10,10,0);border-radius:50%;
    transition:border-color .15s;pointer-events:none;
  }
  .seal-layer:hover .seal-outline, .seal-layer.dragging .seal-outline{border-color:rgba(10,10,10,.5);}

  /* ---------- straddle stamp (骑缝章) ---------- */
  .straddle-layer{
    position:absolute;cursor:ns-resize;touch-action:none;display:none;
    filter:drop-shadow(-1px 2px 4px rgba(0,0,0,.18));
    outline:1.5px dashed rgba(10,10,10,0);outline-offset:2px;
    transition:outline-color .15s;
  }
  .straddle-layer.active{display:block;}
  .straddle-layer:hover, .straddle-layer.dragging{outline-color:rgba(10,10,10,.5);}
  .straddle-img{width:100%;height:100%;display:block;pointer-events:none;user-select:none;object-fit:cover;}

  /* ---------- signature (签名) ---------- */
  .sig-layer{
    position:absolute;cursor:grab;touch-action:none;display:none;
    filter:drop-shadow(0 2px 5px rgba(0,0,0,.15));
  }
  .sig-layer.dragging{cursor:grabbing;}
  .sig-layer.active{display:block;}
  .sig-layer-img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none;}
  .sig-outline{border-radius:6px;inset:-4px;}
  .sig-layer:hover .sig-outline, .sig-layer.dragging .sig-outline{border-color:rgba(10,10,10,.5);}

  /* ---------- loading / toast ---------- */
  .loading-overlay{
    position:fixed;inset:0;background:rgba(10,10,10,.35);display:none;
    align-items:center;justify-content:center;z-index:200;
  }
  .loading-overlay.show{display:flex;}
  .loading-card{
    background:#fff;padding:18px 26px;border-radius:10px;font-size:13px;color:var(--ink);
    display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);
  }
  .spinner{
    width:16px;height:16px;border-radius:50%;border:2.5px solid var(--shell-line);
    border-top-color:var(--ink);animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .toast{
    position:fixed;left:50%;bottom:calc(26px + var(--safe-bottom));transform:translateX(-50%) translateY(10px);
    background:#141414;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:210;opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;max-width:86vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  input[type="file"]{display:none;}

  @media (max-width:640px){
    .landing-title{font-size:32px;}
    .landing-upload{padding:14px 36px;}
    .topbar-inner{
      padding-top:11px;padding-bottom:11px;
      padding-left:calc(14px + var(--safe-left));padding-right:calc(14px + var(--safe-right));
    }
    .toolbar{width:100%;justify-content:flex-start;}
    input[type="text"].fn-input{width:130px;}
    .main{
      padding-top:16px;
      padding-right:calc(10px + var(--safe-right));
      padding-bottom:calc(50px + var(--safe-bottom));
      padding-left:calc(10px + var(--safe-left));
    }
    .seal-grid{grid-template-columns:repeat(3,1fr);gap:10px;}

    /* bottom-sheet modal, native iOS action-sheet style */
    .modal-overlay{align-items:flex-end;padding:0;}
    .modal-panel{
      max-width:none;border-radius:20px 20px 0 0;max-height:85vh;max-height:85dvh;
      padding-bottom:var(--safe-bottom);transform:translateY(100%);
    }
    .modal-overlay.show .modal-panel{transform:translateY(0);}
    .modal-grabber{
      display:block;width:36px;height:4px;border-radius:2px;background:var(--shell-line);
      margin:10px auto 0;flex:none;
    }
  }
</style>
<style>.hub-back{position:fixed;top:16px;left:18px;font-size:13px;color:#a3a3a3;text-decoration:none;padding:6px 8px;z-index:5;transition:color .15s;font-family:inherit}.hub-back:hover{color:#0a0a0a}</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="盖盖">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<style>@keyframes pgin{from{opacity:0}to{opacity:1}}body{animation:pgin .22s ease-out}@media (prefers-reduced-motion:reduce){body{animation:none}}</style>
</head>
<body>

  <!-- ============ landing view: shown before any file is loaded ============ -->
  <div class="landing" id="landingView">
    <a class="hub-back" href="index.html">‹ 工具集</a>
    <div class="landing-mark">
      <svg class="seal-ring" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="29.8" stroke="currentColor" stroke-width="4.9"/>
        <circle cx="50" cy="50" r="8.4" fill="currentColor"/>
      </svg>
      <h1 class="landing-title">盖盖</h1>
    </div>
    <p class="landing-desc">上传 PDF 或图片,拖动印章到合适位置,导出盖好章的文件。</p>
    <button class="landing-upload" id="btnUpload" type="button">上传文件</button>
    <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,.gif,.webp,.bmp,image/*,application/pdf">
    <button class="landing-manage-link" id="btnManageSealsLanding" type="button">管理印章 / 签名</button>

    <button class="landing-info-btn" id="btnLandingInfo" type="button" aria-label="关于本工具">ⓘ</button>
  </div>

  <div class="modal-overlay" id="infoModalOverlay">
    <div class="modal-panel info-panel">
      <div class="modal-grabber"></div>
      <div class="modal-header">
        <span class="modal-title">关于</span>
        <button class="btn-icon" id="btnCloseInfoModal" type="button" aria-label="关闭">✕</button>
      </div>
      <div class="modal-body">
        <p class="info-text">支持 PDF · JPG · PNG — 文件仅在本机浏览器处理,不会上传到任何服务器。</p>
        <p class="info-text">本工具仅适用于催款函、告知函、通知函等日常流转文件,不适用于法庭证据、仲裁材料等正式法律场合。请勿用于任何非法用途,由此产生的一切后果与本软件作者无关。</p>
      </div>
    </div>
  </div>

  <!-- ============ workspace view: shown once a file is loaded ============ -->
  <div class="workspace" id="workspaceView" hidden>
    <div class="topbar">
      <div class="topbar-inner">
        <span class="brand-mark">盖盖</span>
        <div class="toolbar">
          <button class="seal-picker-btn checkerboard" id="btnPickSeal" type="button" title="选择印章">
            <img id="activeSealThumb" alt="当前印章">
          </button>
          <div class="stepper" id="sizeStepper" hidden>
            <button type="button" id="btnSizeDown" aria-label="缩小印章">−</button>
            <span class="stepper-value" id="sizeValue">4.0cm</span>
            <button type="button" id="btnSizeUp" aria-label="放大印章">+</button>
          </div>
          <button class="btn btn-ghost" id="btnReset" hidden>重置</button>

          <label class="mode-toggle sig-toggle"><input type="checkbox" id="chkSignature"> 签名</label>
          <button class="seal-picker-btn checkerboard" id="btnPickSignature" type="button" title="选择签名" hidden>
            <img id="activeSigThumb" alt="当前签名">
          </button>

          <div class="field-group">
            <input type="text" class="fn-input" id="fnInput" placeholder="导出文件名" disabled>
          </div>
          <button class="btn btn-primary" id="btnExport" disabled>导出盖章 PDF</button>
          <button class="btn-icon" id="btnClear" type="button" aria-label="重新上传" title="重新上传">✕</button>
        </div>
      </div>
    </div>

    <div class="main">

      <div class="page-nav" id="pageNav" hidden>
        <div class="page-nav-row">
          <button class="btn" id="btnPrevPage">‹ 上一页</button>
          <span id="pageIndicator">第 1 / 1 页</span>
          <button class="btn" id="btnNextPage">下一页 ›</button>
          <span class="seal-page-pill" id="sealPagePill" hidden>
            印章位于第 <b id="sealPageNum">1</b> 页
            <button id="btnGoSealPage">跳转</button>
            <button id="btnStampHere" hidden>盖到本页</button>
          </span>
          <span class="seal-page-pill" id="multiPageNotice" hidden>
            本页未包含在盖章范围内
            <button id="btnAddCurrentPage">添加本页</button>
          </span>
          <span class="seal-page-pill" id="sigPagePill" hidden>
            签名位于第 <b id="sigPageNum">1</b> 页
            <button id="btnGoSigPage">跳转</button>
            <button id="btnStampSigHere" hidden>移到本页</button>
          </span>
        </div>
        <div class="stamp-modes-row">
          <label class="mode-toggle"><input type="checkbox" id="chkMultiPage"> 多页盖章</label>
          <input type="text" class="range-input" id="multiPageRange" placeholder="全部页面,或如 1,3,5-8" hidden>
          <span class="mode-hint" id="multiPageHint" hidden>翻到某页后拖动印章,即可单独设置该页位置</span>

          <label class="mode-toggle"><input type="checkbox" id="chkStraddle"> 骑缝章</label>
        </div>
      </div>

      <div class="stage-viewport" id="stageViewport">
        <div class="stage-scroll" id="stageScroll">
          <div class="stage-box" id="stageBox">
            <div class="stage-scaler" id="pdfScaler" style="display:none;">
              <canvas class="pdf-canvas" id="pdfCanvas"></canvas>
            </div>
            <div class="stage-scaler" id="imgScaler" style="display:none;">
              <div class="img-content" id="imgContent"><img id="previewImg" alt="预览图"></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

<script>
'use strict';

/* ===================== state ===================== */
const state = {
  fileType:null,          // 'pdf' | 'image'
  fileBaseName:'',
  pdfjsDoc:null,
  pdfLibBytesForExport:null,
  pdfPageCount:1,
  pdfCurrentPage:1,
  imageObjectUrl:null,
  nativeW:794,
  nativeH:1123,
  pageWidthCm:21.0,
  pageHeightCm:29.7,
  sealPage:1,
  sealByPage:new Map(),   // pageNum(1-indexed, images always use 1) -> {xPct,yPct}, independently editable per page (size is fixed)
  multiPage:{ enabled:false, rangeInput:'全部' },
  straddle:{ enabled:false, yPct:50 },
  signatureEnabled:false,
  signaturePage:1,
  signatureByPage:new Map(), // pageNum -> {xPct,yPct}; size is fixed (3.5cm x 3cm)
  activeScalerEl:null,
  busy:false
};
const SEAL_SIZE_CM = 4.0; // fixed diameter used by the straddle stamp (骑缝章), not user-adjustable
const DEFAULT_SEAL = ()=>({ xPct:56, yPct:70, sizeCm:SEAL_SIZE_CM });
const SIGNATURE_WIDTH_CM = 3.5;   // fixed signature box — ~16.7% of A4 width
const SIGNATURE_HEIGHT_CM = 3.0;  // fixed signature box — ~10.1% of A4 height
const DEFAULT_SIGNATURE_POS = ()=>({ xPct:28, yPct:80 });
function activePageKey(){ return state.fileType==='pdf' ? state.pdfCurrentPage : 1; }
function getSealEntry(pageNum){
  if(!state.sealByPage.has(pageNum)) state.sealByPage.set(pageNum, DEFAULT_SEAL());
  return state.sealByPage.get(pageNum);
}
function currentSealEntry(){ return getSealEntry(activePageKey()); }
function getSignatureEntry(pageNum){
  if(!state.signatureByPage.has(pageNum)) state.signatureByPage.set(pageNum, DEFAULT_SIGNATURE_POS());
  return state.signatureByPage.get(pageNum);
}
function currentSignatureEntry(){ return getSignatureEntry(activePageKey()); }

let pdfjsLib = null;

/* ===================== helpers ===================== */
function showLoading(msg){ loadingText.textContent = msg||'处理中…'; loadingOverlay.classList.add('show'); }
function hideLoading(){ loadingOverlay.classList.remove('show'); }
let toastTimer=null;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 3600);
}
function clamp(v,min,max){ return Math.min(Math.max(v,min),max); }
function sanitizeFilename(name){
  name = (name||'').trim().replace(/[\\/:*?"<>|]/g,'_').replace(/\.(pdf)$/i,'');
  if(!name) name = '未命名文件';
  return name;
}
function base64ToBytes(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
}

let sealBytesCache = null;
function getSealBytes(){
  if(!sealBytesCache){
    const b64 = sealImg.src.split(',')[1];
    sealBytesCache = base64ToBytes(b64);
  }
  return sealBytesCache;
}

let signatureBytesCache = null;
function getSignatureBytes(){
  if(!signatureBytesCache){
    const b64 = sigImg.src.split(',')[1];
    signatureBytesCache = base64ToBytes(b64);
  }
  return signatureBytesCache;
}

/* ===================== seal library ===================== */
const BUNDLED_SEAL_DATAURL = sealImg.src; // the seal already baked into this file, used as the built-in default
const SEAL_LIB_KEY = 'gaigai_seal_library_v1';
const SEAL_SEEDED_KEY = 'gaigai_seal_seeded_v1';
const SEAL_ACTIVE_KEY = 'gaigai_active_seal_id_v1';

function loadSealLibrary(){
  try{
    const raw = localStorage.getItem(SEAL_LIB_KEY);
    const list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list : [];
  }catch(e){ return []; }
}
function saveSealLibrary(list){
  try{
    localStorage.setItem(SEAL_LIB_KEY, JSON.stringify(list));
    return true;
  }catch(e){
    showToast('印章保存失败,可能是浏览器存储空间不足');
    return false;
  }
}
function seedDefaultSealIfNeeded(){
  try{
    if(localStorage.getItem(SEAL_SEEDED_KEY)) return;
    localStorage.setItem(SEAL_SEEDED_KEY, '1');
    const list = loadSealLibrary();
    if(list.length===0){
      list.push({ id:'seed-default', name:'默认印章', dataUrl:BUNDLED_SEAL_DATAURL, createdAt:Date.now() });
      saveSealLibrary(list);
    }
  }catch(e){}
}

let sealLibrary = [];
let activeSealId = null;

async function setActiveSeal(entry){
  sealImg.src = entry.dataUrl;
  try{ await sealImg.decode(); }catch(e){}
  sealBytesCache = null;
  activeSealId = entry.id;
  try{ localStorage.setItem(SEAL_ACTIVE_KEY, entry.id); }catch(e){}
  activeSealThumb.src = entry.dataUrl;
  if(state.straddle.enabled) renderStraddlePreviewForCurrentPage();
}

function fallbackBundledEntry(){
  return { id:'bundled', name:'默认印章', dataUrl:BUNDLED_SEAL_DATAURL, createdAt:0 };
}

function initSealLibrary(){
  seedDefaultSealIfNeeded();
  sealLibrary = loadSealLibrary();
  let entry = null;
  try{
    const savedId = localStorage.getItem(SEAL_ACTIVE_KEY);
    if(savedId) entry = sealLibrary.find(s=>s.id===savedId) || null;
  }catch(e){}
  if(!entry) entry = sealLibrary[0] || fallbackBundledEntry();
  setActiveSeal(entry);
}

/* ---------- automatic red-ink extraction (白底红色印章 -> 透明抠图) ---------- */
function extractSealFromImage(file){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      try{
        const maxDim = 900;
        const scale = Math.min(1, maxDim/Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth*scale));
        const h = Math.max(1, Math.round(img.naturalHeight*scale));
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);

        const imageData = ctx.getImageData(0,0,w,h);
        const data = imageData.data;
        const LO=16, HI=66;
        let minX=w, minY=h, maxX=-1, maxY=-1;
        for(let i=0;i<data.length;i+=4){
          const r=data[i], g=data[i+1], b=data[i+2];
          const maxgb = g>b ? g : b;
          const redness = r - maxgb;
          let a = 0;
          if(r>=60){
            let frac = (redness-LO)/(HI-LO);
            if(frac<0) frac=0; else if(frac>1) frac=1;
            a = Math.round(frac*255);
          }
          data[i+3] = a;
          if(a>12){
            const idx = i/4;
            const x = idx%w, y = (idx/w)|0;
            if(x<minX) minX=x; if(x>maxX) maxX=x;
            if(y<minY) minY=y; if(y>maxY) maxY=y;
          }
        }
        if(maxX<minX || maxY<minY){
          reject(new Error('没有识别到红色印章内容,请换一张白底红色印章的图片试试'));
          return;
        }
        ctx.putImageData(imageData, 0, 0);
        const pad = 6;
        const cx0=Math.max(0,minX-pad), cy0=Math.max(0,minY-pad);
        const cx1=Math.min(w,maxX+pad+1), cy1=Math.min(h,maxY+pad+1);
        const cw=cx1-cx0, ch=cy1-cy0;
        const out = document.createElement('canvas');
        out.width=cw; out.height=ch;
        out.getContext('2d').drawImage(canvas, cx0,cy0,cw,ch, 0,0,cw,ch);
        resolve(out.toDataURL('image/png'));
      }catch(err){ reject(err); }
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
    img.src = url;
  });
}

/* ---------- modal: browse / search / pick / delete / add ---------- */
function openAssetModal(tab){
  sealLibrary = loadSealLibrary();
  signatureLibrary = loadSignatureLibrary();
  sealSearchInput.value = '';
  sigSearchInput.value = '';
  switchModalTab(tab || 'seal');
  sealModalOverlay.classList.add('show');
}
function closeSealModal(){
  sealModalOverlay.classList.remove('show');
}
function switchModalTab(tab){
  tabSeal.classList.toggle('active', tab==='seal');
  tabSignature.classList.toggle('active', tab==='signature');
  if(tab==='seal'){
    showSealBrowseView();
    renderSealGrid(sealSearchInput.value);
  } else {
    showSigBrowseView();
    renderSigGrid(sigSearchInput.value);
  }
}
function showSealBrowseView(){ sealBrowseView.hidden=false; sealPreviewView.hidden=true; sigBrowseView.hidden=true; sigDrawView.hidden=true; }
function showSealPreviewView(){ sealBrowseView.hidden=true; sealPreviewView.hidden=false; sigBrowseView.hidden=true; sigDrawView.hidden=true; }
function showSigBrowseView(){ sealBrowseView.hidden=true; sealPreviewView.hidden=true; sigBrowseView.hidden=false; sigDrawView.hidden=true; }
function showSigDrawView(){
  sealBrowseView.hidden=true; sealPreviewView.hidden=true; sigBrowseView.hidden=true; sigDrawView.hidden=false;
  clearSignatureCanvas();
  sigNameInput.value = '';
  updateSigRotateHint();
}

function renderSealGrid(query){
  const q = (query||'').trim().toLowerCase();
  const filtered = q ? sealLibrary.filter(s=>s.name.toLowerCase().includes(q)) : sealLibrary;
  sealGrid.innerHTML = '';

  const addCard = document.createElement('button');
  addCard.type = 'button';
  addCard.className = 'seal-card seal-card-add';
  addCard.innerHTML = '<span class="seal-card-thumb"><span class="seal-card-add-icon">+</span></span><span class="seal-card-name">添加印章</span>';
  addCard.addEventListener('click', ()=>sealFileInput.click());
  sealGrid.appendChild(addCard);

  filtered.forEach(entry=>{
    const card = document.createElement('div');
    card.className = 'seal-card' + (entry.id===activeSealId ? ' active' : '');
    const thumbBtn = document.createElement('button');
    thumbBtn.type = 'button';
    thumbBtn.className = 'seal-card-thumb checkerboard';
    thumbBtn.setAttribute('aria-label', '选择 '+entry.name);
    const thumbImg = document.createElement('img');
    thumbImg.src = entry.dataUrl;
    thumbImg.alt = entry.name;
    thumbBtn.appendChild(thumbImg);
    thumbBtn.addEventListener('click', async ()=>{ await setActiveSeal(entry); closeSealModal(); });

    const nameEl = document.createElement('span');
    nameEl.className = 'seal-card-name';
    nameEl.textContent = entry.name;

    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'seal-card-delete';
    delBtn.setAttribute('aria-label', '删除 '+entry.name);
    delBtn.textContent = '✕';
    delBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(confirm('删除印章"'+entry.name+'"？')) deleteSeal(entry.id);
    });

    card.appendChild(thumbBtn);
    card.appendChild(nameEl);
    card.appendChild(delBtn);
    sealGrid.appendChild(card);
  });

  if(filtered.length===0 && q){
    const empty = document.createElement('div');
    empty.className = 'seal-grid-empty';
    empty.textContent = '没有找到匹配的印章';
    sealGrid.appendChild(empty);
  }
}

function deleteSeal(id){
  sealLibrary = sealLibrary.filter(s=>s.id!==id);
  saveSealLibrary(sealLibrary);
  if(activeSealId===id){
    setActiveSeal(sealLibrary[0] || fallbackBundledEntry());
  }
  renderSealGrid(sealSearchInput.value);
}

btnManageSealsLanding.addEventListener('click', ()=>openAssetModal('seal'));
btnPickSeal.addEventListener('click', ()=>openAssetModal('seal'));
btnPickSignature.addEventListener('click', ()=>openAssetModal('signature'));
btnCloseSealModal.addEventListener('click', closeSealModal);
sealModalOverlay.addEventListener('click', (e)=>{ if(e.target===sealModalOverlay) closeSealModal(); });

btnLandingInfo.addEventListener('click', ()=>infoModalOverlay.classList.add('show'));
btnCloseInfoModal.addEventListener('click', ()=>infoModalOverlay.classList.remove('show'));
infoModalOverlay.addEventListener('click', (e)=>{ if(e.target===infoModalOverlay) infoModalOverlay.classList.remove('show'); });
sealSearchInput.addEventListener('input', ()=>renderSealGrid(sealSearchInput.value));
sigSearchInput.addEventListener('input', ()=>renderSigGrid(sigSearchInput.value));
tabSeal.addEventListener('click', ()=>switchModalTab('seal'));
tabSignature.addEventListener('click', ()=>switchModalTab('signature'));

let pendingExtractedDataUrl = null;
sealFileInput.addEventListener('change', async (e)=>{
  const file = e.target.files && e.target.files[0];
  sealFileInput.value = '';
  if(!file) return;
  showLoading('正在识别印章…');
  try{
    const dataUrl = await extractSealFromImage(file);
    pendingExtractedDataUrl = dataUrl;
    sealPreviewImg.src = dataUrl;
    sealNameInput.value = sanitizeFilename(file.name.replace(/\.[^/.]+$/,''));
    showSealPreviewView();
  }catch(err){
    showToast(err && err.message ? err.message : '印章识别失败,请换一张图片试试');
  }finally{
    hideLoading();
  }
});
btnCancelSealAdd.addEventListener('click', ()=>{
  pendingExtractedDataUrl = null;
  showSealBrowseView();
});
btnSaveSeal.addEventListener('click', async ()=>{
  if(!pendingExtractedDataUrl) return;
  const rawName = (sealNameInput.value||'').trim();
  const name = rawName ? rawName.replace(/[\\/:*?"<>|]/g,'_') : '未命名印章';
  const entry = { id:'seal_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), name, dataUrl:pendingExtractedDataUrl, createdAt:Date.now() };
  sealLibrary.push(entry);
  if(!saveSealLibrary(sealLibrary)) return;
  pendingExtractedDataUrl = null;
  await setActiveSeal(entry);
  showSealBrowseView();
  renderSealGrid(sealSearchInput.value);
});

/* ===================== signature library ===================== */
const SIG_LIB_KEY = 'gaigai_signature_library_v1';
const SIG_ACTIVE_KEY = 'gaigai_active_signature_id_v1';
let signatureLibrary = [];
let activeSignatureId = null;

function loadSignatureLibrary(){
  try{
    const raw = localStorage.getItem(SIG_LIB_KEY);
    const list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list : [];
  }catch(e){ return []; }
}
function saveSignatureLibrary(list){
  try{
    localStorage.setItem(SIG_LIB_KEY, JSON.stringify(list));
    return true;
  }catch(e){
    showToast('签名保存失败,可能是浏览器存储空间不足');
    return false;
  }
}
async function setActiveSignature(entry){
  sigImg.src = entry.dataUrl;
  try{ await sigImg.decode(); }catch(e){}
  signatureBytesCache = null;
  activeSignatureId = entry.id;
  try{ localStorage.setItem(SIG_ACTIVE_KEY, entry.id); }catch(e){}
  activeSigThumb.src = entry.dataUrl;
}
function initSignatureLibrary(){
  signatureLibrary = loadSignatureLibrary();
  let entry = null;
  try{
    const savedId = localStorage.getItem(SIG_ACTIVE_KEY);
    if(savedId) entry = signatureLibrary.find(s=>s.id===savedId) || null;
  }catch(e){}
  if(!entry) entry = signatureLibrary[0] || null;
  if(entry) setActiveSignature(entry);
}

function renderSigGrid(query){
  const q = (query||'').trim().toLowerCase();
  const filtered = q ? signatureLibrary.filter(s=>s.name.toLowerCase().includes(q)) : signatureLibrary;
  sigGrid.innerHTML = '';

  const addCard = document.createElement('button');
  addCard.type = 'button';
  addCard.className = 'seal-card seal-card-add';
  addCard.innerHTML = '<span class="seal-card-thumb"><span class="seal-card-add-icon">+</span></span><span class="seal-card-name">新建签名</span>';
  addCard.addEventListener('click', showSigDrawView);
  sigGrid.appendChild(addCard);

  filtered.forEach(entry=>{
    const card = document.createElement('div');
    card.className = 'seal-card' + (entry.id===activeSignatureId ? ' active' : '');
    const thumbBtn = document.createElement('button');
    thumbBtn.type = 'button';
    thumbBtn.className = 'seal-card-thumb checkerboard';
    thumbBtn.setAttribute('aria-label', '选择 '+entry.name);
    const thumbImg = document.createElement('img');
    thumbImg.src = entry.dataUrl;
    thumbImg.alt = entry.name;
    thumbBtn.appendChild(thumbImg);
    thumbBtn.addEventListener('click', async ()=>{ await setActiveSignature(entry); closeSealModal(); });

    const nameEl = document.createElement('span');
    nameEl.className = 'seal-card-name';
    nameEl.textContent = entry.name;

    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'seal-card-delete';
    delBtn.setAttribute('aria-label', '删除 '+entry.name);
    delBtn.textContent = '✕';
    delBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(confirm('删除签名"'+entry.name+'"？')) deleteSignature(entry.id);
    });

    card.appendChild(thumbBtn);
    card.appendChild(nameEl);
    card.appendChild(delBtn);
    sigGrid.appendChild(card);
  });

  if(filtered.length===0 && q){
    const empty = document.createElement('div');
    empty.className = 'seal-grid-empty';
    empty.textContent = '没有找到匹配的签名';
    sigGrid.appendChild(empty);
  }
}

function deleteSignature(id){
  signatureLibrary = signatureLibrary.filter(s=>s.id!==id);
  saveSignatureLibrary(signatureLibrary);
  if(activeSignatureId===id){
    activeSignatureId = null;
    signatureBytesCache = null;
    sigImg.removeAttribute('src');
    activeSigThumb.removeAttribute('src');
    const next = signatureLibrary[0];
    if(next){
      setActiveSignature(next);
    } else {
      state.signatureEnabled = false;
      chkSignature.checked = false;
      btnPickSignature.hidden = true;
      sigLayer.classList.remove('active');
      sigPagePill.hidden = true;
    }
  }
  renderSigGrid(sigSearchInput.value);
}

/* ---------- signature drawing pad ---------- */
const sigCtx = signatureCanvas.getContext('2d');
sigCtx.lineCap = 'round';
sigCtx.lineJoin = 'round';
sigCtx.fillStyle = '#0A0A0A';
sigCtx.strokeStyle = '#0A0A0A';
let sigDrawingActive = false;
let sigHasInk = false;

// Variable-width, velocity-responsive stroke: slower movement lays down a
// bolder line, faster movement thins out — this alone (plus a soft taper on
// stroke start) reads as natural handwriting instead of a uniform wire line.
const SIG_MIN_WIDTH = 5.5;
const SIG_MAX_WIDTH = 13;
let sigLastPoint = null;
let sigLastWidth = SIG_MAX_WIDTH;
let sigLastTime = 0;

function sigCanvasPoint(e){
  const rect = signatureCanvas.getBoundingClientRect();
  const scaleX = signatureCanvas.width/rect.width;
  const scaleY = signatureCanvas.height/rect.height;
  return { x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY };
}
function widthForSpeed(pxPerMs){
  const t = clamp(pxPerMs/2.4, 0, 1);
  return SIG_MAX_WIDTH - t*(SIG_MAX_WIDTH-SIG_MIN_WIDTH);
}
signatureCanvas.addEventListener('pointerdown', (e)=>{
  sigDrawingActive = true;
  const p = sigCanvasPoint(e);
  sigLastPoint = p;
  sigLastTime = performance.now();
  sigLastWidth = SIG_MIN_WIDTH + (SIG_MAX_WIDTH-SIG_MIN_WIDTH)*0.35; // taper in: start a touch lighter, like a pen landing
  sigCtx.beginPath();
  sigCtx.arc(p.x, p.y, sigLastWidth/2, 0, Math.PI*2);
  sigCtx.fill();
  if(!sigHasInk){ sigHasInk = true; btnSaveSig.disabled = false; }
  try{ signatureCanvas.setPointerCapture(e.pointerId); }catch(err){}
  e.preventDefault();
});
signatureCanvas.addEventListener('pointermove', (e)=>{
  if(!sigDrawingActive) return;
  const p = sigCanvasPoint(e);
  const now = performance.now();
  const dt = Math.max(1, now-sigLastTime);
  const dist = Math.hypot(p.x-sigLastPoint.x, p.y-sigLastPoint.y);
  const targetWidth = widthForSpeed(dist/dt);
  const w = sigLastWidth*0.7 + targetWidth*0.3; // smooth out jitter between segments

  sigCtx.lineWidth = w;
  sigCtx.beginPath();
  sigCtx.moveTo(sigLastPoint.x, sigLastPoint.y);
  sigCtx.lineTo(p.x, p.y);
  sigCtx.stroke();

  sigLastPoint = p;
  sigLastWidth = w;
  sigLastTime = now;
  e.preventDefault();
});
function endSigStroke(){ sigDrawingActive = false; sigLastPoint = null; }
signatureCanvas.addEventListener('pointerup', endSigStroke);
signatureCanvas.addEventListener('pointercancel', endSigStroke);
signatureCanvas.addEventListener('pointerleave', endSigStroke);

function clearSignatureCanvas(){
  sigCtx.clearRect(0, 0, signatureCanvas.width, signatureCanvas.height);

}

function extractSignatureFromCanvas(){
  const w = signatureCanvas.width, h = signatureCanvas.height;
  const imageData = sigCtx.getImageData(0, 0, w, h);
  const data = imageData.data;
  let minX=w, minY=h, maxX=-1, maxY=-1;
  for(let i=0;i<data.length;i+=4){
    if(data[i+3]>12){
      const idx = i/4, x = idx%w, y = (idx/w)|0;
      if(x<minX) minX=x; if(x>maxX) maxX=x;
      if(y<minY) minY=y; if(y>maxY) maxY=y;
    }
  }
  if(maxX<minX || maxY<minY) return null;
  const pad = 10;
  const cx0=Math.max(0,minX-pad), cy0=Math.max(0,minY-pad);
  const cx1=Math.min(w,maxX+pad+1), cy1=Math.min(h,maxY+pad+1);
  const cw=cx1-cx0, ch=cy1-cy0;
  const out = document.createElement('canvas');
  out.width=cw; out.height=ch;
  out.getContext('2d').drawImage(signatureCanvas, cx0,cy0,cw,ch, 0,0,cw,ch);
  return out.toDataURL('image/png');
}

function fitStage(){
  if(!state.activeScalerEl) return;
  const w = stageBox.clientWidth || stageBox.getBoundingClientRect().width;
  if(!w){ requestAnimationFrame(fitStage); return; }
  const scale = w / state.nativeW;
  const scaler = state.activeScalerEl;
  scaler.style.width = state.nativeW+'px';
  scaler.style.height = state.nativeH+'px';
  scaler.style.transform = 'scale('+scale+')';
  stageBox.style.height = (state.nativeH*scale)+'px';
}

function setActiveScaler(elToShow){
  [pdfScaler, imgScaler].forEach(s=>{ s.style.display = (s===elToShow) ? 'block':'none'; });

  if(sealLayer.parentElement !== elToShow){ elToShow.appendChild(sealLayer); }
  if(sigLayer.parentElement !== elToShow){ elToShow.appendChild(sigLayer); }
  if(straddleLayer.parentElement !== pdfScaler){ pdfScaler.appendChild(straddleLayer); }
  fitStage();
}

/* ===================== page physical size normalization =====================
   Some PDFs (especially scan-to-PDF apps and certain office/export tools) declare
   a MediaBox that doesn't correspond to the true physical paper size, even though
   the page's shape still matches a standard sheet. If we trusted the raw point
   math on such a page, a "4cm" seal could render visibly larger or smaller than a
   real 4cm stamp already printed/scanned onto that page. To stay consistent with
   what a real seal looks like, snap to the nearest standard paper width when the
   page's aspect ratio is a close match, and only fall back to the page's own
   declared size for genuinely non-standard/custom page shapes. */
const STANDARD_PAPERS_CM = [
  { ratio:297/210, widthCm:21.0,  heightCm:29.7 },  // A4 portrait
  { ratio:210/297, widthCm:29.7,  heightCm:21.0 },  // A4 landscape
  { ratio:11/8.5,  widthCm:21.59, heightCm:27.94 }, // US Letter portrait
  { ratio:8.5/11,  widthCm:27.94, heightCm:21.59 }, // US Letter landscape
];
function normalizedPageSizeCm(widthPt, heightPt){
  const trueWidthCm = (widthPt/72)*2.54;
  const trueHeightCm = (heightPt/72)*2.54;
  const ratio = trueHeightCm/trueWidthCm;
  let best=null, bestDiff=Infinity;
  STANDARD_PAPERS_CM.forEach(std=>{
    const diff = Math.abs(ratio-std.ratio);
    if(diff<bestDiff){ bestDiff=diff; best=std; }
  });
  if(best && bestDiff/best.ratio < 0.02) return { widthCm:best.widthCm, heightCm:best.heightCm };
  return { widthCm:trueWidthCm, heightCm:trueHeightCm };
}
function normalizedPageWidthCm(widthPt, heightPt){ return normalizedPageSizeCm(widthPt, heightPt).widthCm; }

/* ===================== seal geometry (per-page) ===================== */
function currentWPct(){ return currentSealEntry().sizeCm / state.pageWidthCm * 100; }
function clampSeal(){
  const s = currentSealEntry();
  const wPct = currentWPct();
  const hPctOfHeight = (wPct/100*state.nativeW) / state.nativeH * 100;
  s.xPct = clamp(s.xPct, 0, Math.max(0,100-wPct));
  s.yPct = clamp(s.yPct, 0, Math.max(0,100-hPctOfHeight));
}
function applySealStyle(){
  const s = currentSealEntry();
  const wPct = currentWPct();
  sealLayer.style.left = s.xPct+'%';
  sealLayer.style.top = s.yPct+'%';
  sealLayer.style.width = wPct+'%';
  sizeValue.textContent = s.sizeCm.toFixed(1)+'cm';
}
function adjustSealSize(delta){
  const s = currentSealEntry();
  s.sizeCm = clamp(Math.round((s.sizeCm+delta)*10)/10, 2.0, 8.0);
  clampSeal();
  applySealStyle();
}
function updateSealVisibility(){
  // each page keeps its own independent position (see sealByPage)
  sealPagePill.hidden = true;
  multiPageNotice.hidden = true;

  if(state.fileType!=='pdf'){
    sealLayer.classList.toggle('active', !!state.fileType);
    return;
  }

  if(state.multiPage.enabled){
    const range = parsePageRange(state.multiPage.rangeInput, state.pdfPageCount);
    const included = range.includes(state.pdfCurrentPage);
    sealLayer.classList.toggle('active', included);
    multiPageNotice.hidden = included;
  } else {
    const onSealPage = state.pdfCurrentPage===state.sealPage;
    sealLayer.classList.toggle('active', onSealPage);
    sealPagePill.hidden = state.pdfPageCount<=1 && onSealPage;
    sealPageNum.textContent = state.sealPage;
    btnGoSealPage.hidden = onSealPage;
    btnStampHere.hidden = onSealPage;
  }
}

  state.multiPage.rangeInput = multiPageRange.value;

});

/* ===================== signature (签名) geometry ===================== */
function currentSigWPct(){ return SIGNATURE_WIDTH_CM/state.pageWidthCm*100; }
function currentSigHPct(){ return SIGNATURE_HEIGHT_CM/state.pageHeightCm*100; }
function clampSignature(){
  const s = currentSignatureEntry();
  const wPct = currentSigWPct(), hPct = currentSigHPct();
  s.xPct = clamp(s.xPct, 0, Math.max(0,100-wPct));
  s.yPct = clamp(s.yPct, 0, Math.max(0,100-hPct));
}
function applySignatureStyle(){
  const s = currentSignatureEntry();
  sigLayer.style.left = s.xPct+'%';
  sigLayer.style.top = s.yPct+'%';
  sigLayer.style.width = currentSigWPct()+'%';
  sigLayer.style.height = currentSigHPct()+'%';
}
function updateSignatureVisibility(){

/* ===================== straddle stamp (骑缝章) geometry ===================== */
function getStraddleStripDataURL(sliceIndex, totalSlices){
  const naturalW = sealImg.naturalWidth || 600;
  const naturalH = sealImg.naturalHeight || 600;
  const sliceSrcW = naturalW/totalSlices;
  const outW = Math.max(1, Math.round(sliceSrcW));
  const canvas = document.createElement('canvas');
  canvas.width = outW; canvas.height = naturalH;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(sealImg, sliceIndex*sliceSrcW, 0, sliceSrcW, naturalH, 0, 0, outW, naturalH);
  return canvas.toDataURL('image/png');
}
function applyStraddleStyle(){
  const N = Math.max(1, state.pdfPageCount);
  const wPctFull = SEAL_SIZE_CM/state.pageWidthCm*100;
  const hPctFull = (wPctFull/100*state.nativeW)/state.nativeH*100;
  const stripWPct = wPctFull/N;
  const topPct = clamp(state.straddle.yPct - hPctFull/2, 0, Math.max(0,100-hPctFull));
  straddleLayer.style.left = Math.max(0,100-stripWPct)+'%';
  straddleLayer.style.top = topPct+'%';
  straddleLayer.style.width = stripWPct+'%';
  straddleLayer.style.height = hPctFull+'%';
}
function renderStraddlePreviewForCurrentPage(){
  if(!(state.fileType==='pdf' && state.pdfPageCount>=2)) return;
  const N = state.pdfPageCount;
  const idx = state.pdfCurrentPage-1;
  straddleImg.src = getStraddleStripDataURL(idx, N);
  applyStraddleStyle();
}
function updateStraddleVisibility(){
  const show = state.fileType==='pdf' && state.pdfPageCount>=2 && state.straddle.enabled;
  straddleLayer.classList.toggle('active', show);
  if(show) renderStraddlePreviewForCurrentPage();
}

function parsePageRange(input, maxPage){
  const trimmed = (input||'').trim();
  if(!trimmed || /^(全部|全部页面|all)$/i.test(trimmed)){
    const arr=[]; for(let i=1;i<=maxPage;i++) arr.push(i);
    return arr;
  }
  const result = new Set();
  trimmed.split(/[,,]/).forEach(part=>{
    part = part.trim();
    if(!part) return;
    const m = part.match(/^(\d+)\s*-\s*(\d+)$/);
    if(m){
      let a=parseInt(m[1],10), b=parseInt(m[2],10);
      if(a>b){ const t=a; a=b; b=t; }
      for(let i=a;i<=b;i++) if(i>=1 && i<=maxPage) result.add(i);
    } else {
      const n = parseInt(part,10);
      if(!isNaN(n) && n>=1 && n<=maxPage) result.add(n);
    }
  });
  return Array.from(result).sort((a,b)=>a-b);
}

function detectType(file){
  const name = file.name.toLowerCase();
  if(name.endsWith('.pdf')) return 'pdf';
  const imgExt = /\.(jpe?g|png|gif|webp|bmp)$/i;
  if(imgExt.test(name)) return 'image';
  if(file.type && file.type.startsWith('image/')) return 'image';
  if(file.type === 'application/pdf') return 'pdf';
  return null;
}

  btnReset.hidden = !loaded;

  fnInput.disabled = !loaded;
  btnExport.disabled = !loaded;

function showLanding(){ workspaceView.hidden = true; landingView.hidden = false; }

async function loadFile(file){
  const type = detectType(file);
  if(!type){
    showToast('只能上传 PDF 或图片文件(JPG / PNG 等),请重新选择');
    return;
  }
  showLoading('正在加载文件…');
  try{
    resetFileState({ keepView:true });
    state.fileType = type;
    state.fileBaseName = sanitizeFilename(file.name.replace(/\.[^/.]+$/,''));
    fnInput.value = state.fileBaseName + '_已盖章';
    setFileLoadedUI(true);

    // switch to the workspace BEFORE rendering, so fitStage() can read a real width
    showWorkspace();

    if(type==='pdf') await loadPdf(file);
    else await loadImage(file);
  }catch(err){
    console.error(err);
    showToast('文件解析失败:'+(err && err.message ? err.message : '未知错误'));
    resetFileState({ keepView:false });
  }finally{
    hideLoading();
  }
}

/* ---------- PDF ---------- */
async function loadPdf(file){
  const buf1 = await file.arrayBuffer();
  const buf2 = buf1.slice(0);
  state.pdfLibBytesForExport = buf2;

  if(!pdfjsLib){
    await __L('pdfjs');
    pdfjsLib = window['pdfjs-dist/build/pdf'];
  }
  const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(buf1) });
  state.pdfjsDoc = await loadingTask.promise;
  state.pdfPageCount = state.pdfjsDoc.numPages;
  state.sealPage = state.pdfPageCount; // default: stamp on last page
  state.signaturePage = state.pdfPageCount; // default: signature on last page too
  state.pdfCurrentPage = state.pdfPageCount; // preview also opens on the last page, matching the default stamp target

  pageNav.hidden = state.pdfPageCount<=1;
  await renderPdfPage(state.pdfCurrentPage);
}

async function renderPdfPage(pageNum){
  const page = await state.pdfjsDoc.getPage(pageNum);
  const baseViewport = page.getViewport({ scale: 1 });
  state.nativeW = 794;
  state.nativeH = Math.round(794 * (baseViewport.height/baseViewport.width));
  { const sz = normalizedPageSizeCm(baseViewport.width, baseViewport.height); state.pageWidthCm = sz.widthCm; state.pageHeightCm = sz.heightCm; }

  const renderScale = state.nativeW/baseViewport.width;
  const viewport = page.getViewport({ scale: renderScale });
  pdfCanvas.width = viewport.width;
  pdfCanvas.height = viewport.height;
  const ctx = pdfCanvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;

  setActiveScaler(pdfScaler);
  clampSeal(); applySealStyle();
  updateSealVisibility();
  updateStraddleVisibility();
  clampSignature(); applySignatureStyle();
  updateSignatureVisibility();
  pageIndicator.textContent = '第 '+pageNum+' / '+state.pdfPageCount+' 页';
  btnPrevPage.disabled = pageNum<=1;
  btnNextPage.disabled = pageNum>=state.pdfPageCount;
}

btnPrevPage.addEventListener('click', async ()=>{
  if(state.pdfCurrentPage>1){ state.pdfCurrentPage--; showLoading('加载页面…'); try{ await renderPdfPage(state.pdfCurrentPage);}finally{hideLoading();} }
});
btnNextPage.addEventListener('click', async ()=>{
  if(state.pdfCurrentPage<state.pdfPageCount){ state.pdfCurrentPage++; showLoading('加载页面…'); try{ await renderPdfPage(state.pdfCurrentPage);}finally{hideLoading();} }
});
btnGoSealPage.addEventListener('click', async ()=>{
  state.pdfCurrentPage = state.sealPage;
  showLoading('加载页面…'); try{ await renderPdfPage(state.pdfCurrentPage);}finally{hideLoading();}
});
btnStampHere.addEventListener('click', ()=>{
  state.sealPage = state.pdfCurrentPage;
  updateSealVisibility();
});

/* ---------- IMAGE (JPG/PNG/etc.) ---------- */
async function loadImage(file){
  const url = URL.createObjectURL(file);
  const natural = await new Promise((resolve, reject)=>{
    const probe = new Image();
    probe.onload = ()=>resolve({ w:probe.naturalWidth, h:probe.naturalHeight });
    probe.onerror = ()=>reject(new Error('图片解析失败'));
    probe.src = url;
  });
  state.imageObjectUrl = url;

  state.nativeW = 794;
  state.nativeH = 1123;
  state.pageWidthCm = 21.0;
  state.pageHeightCm = 29.7;

  // fit image within the A4 page (contain), centered, like placing a photo on a sheet
  const margin = 24;
  const availW = state.nativeW - margin*2;
  const availH = state.nativeH - margin*2;
  const ratio = Math.min(availW/natural.w, availH/natural.h);
  const dispW = natural.w*ratio;
  const dispH = natural.h*ratio;
  const left = (state.nativeW-dispW)/2;
  const top = (state.nativeH-dispH)/2;

  previewImg.src = url;
  previewImg.style.width = dispW+'px';
  previewImg.style.height = dispH+'px';
  previewImg.style.left = left+'px';
  previewImg.style.top = top+'px';

  pageNav.hidden = true;
  setActiveScaler(imgScaler);
  clampSeal(); applySealStyle();
  updateSealVisibility();
  clampSignature(); applySignatureStyle();
  updateSignatureVisibility();
}

/* ===================== export ===================== */
btnExport.addEventListener('click', async ()=>{
  if(!state.fileType || state.busy) return;
  if(state.fileType==='pdf' && state.multiPage.enabled){
    const check = parsePageRange(state.multiPage.rangeInput, state.pdfPageCount);
    if(check.length===0){
      showToast('多页盖章的页码范围无效,请检查后重试,例如: 1,3,5-8');
      return;
    }
  }
  const filename = sanitizeFilename(fnInput.value || (state.fileBaseName+'_已盖章'));
  state.busy = true;
  btnExport.disabled = true;
  showLoading('正在生成盖章 PDF…');
  try{
    if(state.fileType==='pdf') await exportStampedPdf(filename);
    else await exportFromHtml(filename, imgScaler);
  }catch(err){
    console.error(err);
    showToast('导出失败:'+(err && err.message ? err.message : '未知错误'));
  }finally{
    hideLoading();
    btnExport.disabled=false;
    state.busy=false;
  }
});

async function exportStampedPdf(filename){
  await __L('pdflib');
  const { PDFDocument } = PDFLib;
  const pdfDoc = await PDFDocument.load(state.pdfLibBytesForExport);
  const pages = pdfDoc.getPages();
  const totalPages = pages.length;

  // ---- primary seal: one page, or several pages when 多页盖章 is enabled ----
  const primaryTargets = state.multiPage.enabled
    ? parsePageRange(state.multiPage.rangeInput, totalPages)
    : [clamp(state.sealPage, 1, totalPages)];

  if(primaryTargets.length){
    const pngImage = await pdfDoc.embedPng(getSealBytes());
    primaryTargets.forEach(pageNum=>{
      const s = getSealEntry(pageNum); // each page keeps its own independent position AND size
      const page = pages[pageNum-1];
      const { width:pw, height:ph } = page.getSize();
      const pageWidthCm = normalizedPageWidthCm(pw, ph);
      const wPct = s.sizeCm/pageWidthCm*100;
      const sealWpt = wPct/100*pw;
      const sealHpt = sealWpt;
      const xPt = s.xPct/100*pw;
      const yFromTopPt = s.yPct/100*ph;
      const yPt = ph - yFromTopPt - sealHpt;
      page.drawImage(pngImage, { x:xPt, y:yPt, width:sealWpt, height:sealHpt });
    });
  }

  // ---- straddle seal (骑缝章): sliced across every page of the document ----
  if(state.straddle.enabled && totalPages>=2){
    const N = totalPages;
    for(let i=0;i<N;i++){
      const stripDataUrl = getStraddleStripDataURL(i, N);
      const stripBytes = base64ToBytes(stripDataUrl.split(',')[1]);
      const stripImage = await pdfDoc.embedPng(stripBytes);
      const page = pages[i];
      const { width:pw, height:ph } = page.getSize();
      const pageWidthCm = normalizedPageWidthCm(pw, ph);
      const fullDiameterPt = SEAL_SIZE_CM/pageWidthCm*pw;
      const stripWpt = fullDiameterPt/N;
      const stripHpt = fullDiameterPt;
      const xPt = pw - stripWpt;
      const yCenterFromTopPt = state.straddle.yPct/100*ph;
      const yTopFromTopPt = yCenterFromTopPt - stripHpt/2;
      const yPt = ph - yTopFromTopPt - stripHpt;
      page.drawImage(stripImage, { x:xPt, y:yPt, width:stripWpt, height:stripHpt });
    }
  }

  // ---- signature: fixed-size box (3.5cm x 3cm), signature drawing "contain"-fit and centered within it ----
  if(state.signatureEnabled && activeSignatureId){
    const targetPage = clamp(state.signaturePage, 1, totalPages);
    const s = getSignatureEntry(targetPage);
    const page = pages[targetPage-1];
    const { width:pw, height:ph } = page.getSize();
    const sz = normalizedPageSizeCm(pw, ph);
    const boxWpt = SIGNATURE_WIDTH_CM/sz.widthCm*pw;
    const boxHpt = SIGNATURE_HEIGHT_CM/sz.heightCm*ph;
    const imgRatio = (sigImg.naturalWidth||1)/(sigImg.naturalHeight||1);
    const boxRatio = boxWpt/boxHpt;
    let drawW, drawH;
    if(imgRatio > boxRatio){ drawW = boxWpt; drawH = boxWpt/imgRatio; }
    else { drawH = boxHpt; drawW = boxHpt*imgRatio; }
    const offsetX = (boxWpt-drawW)/2;
    const offsetY = (boxHpt-drawH)/2;
    const boxXPt = s.xPct/100*pw;
    const boxYFromTopPt = s.yPct/100*ph;
    const drawXPt = boxXPt + offsetX;
    const drawYFromTopPt = boxYFromTopPt + offsetY;
    const drawYPt = ph - drawYFromTopPt - drawH;
    const sigPng = await pdfDoc.embedPng(getSignatureBytes());
    page.drawImage(sigPng, { x:drawXPt, y:drawYPt, width:drawW, height:drawH });
  }

  const bytes = await pdfDoc.save();
  downloadBlob(new Blob([bytes], { type:'application/pdf' }), filename+'.pdf');
}

async function exportFromHtml(filename, scalerEl){
  await Promise.all([__L('html2canvas'), __L('jspdf')]);
  const EXPORT_SCALE = 2;

  // Render from a detached, unclipped, untransformed clone so that the
  // preview panel's scroll/zoom never affects the captured output.
  const holder = document.createElement('div');
  holder.style.position = 'fixed';
  holder.style.left = '-99999px';
  holder.style.top = '0';
  holder.style.width = state.nativeW+'px';
  holder.style.height = state.nativeH+'px';
  holder.style.overflow = 'visible';
  document.body.appendChild(holder);

  const clone = scalerEl.cloneNode(true);
  clone.style.transform = 'none';
  clone.style.position = 'static';
  clone.style.width = state.nativeW+'px';
  clone.style.height = state.nativeH+'px';
  holder.appendChild(clone);

  const imgs = clone.querySelectorAll('img');
  await Promise.all(Array.from(imgs).map(img=>{
    if(img.complete) return Promise.resolve();
    return new Promise(res=>{ img.onload=res; img.onerror=res; });
  }));

  let canvas;
  try{
    canvas = await html2canvas(clone, {
      scale: EXPORT_SCALE,
      backgroundColor:'#ffffff',
      useCORS:true,
      width: state.nativeW,
      height: state.nativeH,
      windowWidth: state.nativeW
    });
  } finally {
    document.body.removeChild(holder);
  }

  const pageHeightPx = 1123*EXPORT_SCALE;
  const totalPages = Math.max(1, Math.ceil(canvas.height/pageHeightPx));
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit:'mm', format:'a4' });

  for(let i=0;i<totalPages;i++){
    if(i>0) pdf.addPage();
    const slice = document.createElement('canvas');
    slice.width = canvas.width;
    slice.height = pageHeightPx;
    const ctx = slice.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,slice.width,slice.height);
    ctx.drawImage(canvas, 0, i*pageHeightPx, canvas.width, pageHeightPx, 0,0, canvas.width, pageHeightPx);
    const imgData = slice.toDataURL('image/jpeg', 0.92);
    pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
  }
  pdf.save(filename+'.pdf');
}
